name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and TUI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The only Python runtime dependency, for reading paddock.yml. Packaged
      # as python-yaml, which the Arch job installs with the other depends.
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      # Discovery includes the real PTY acceptance suite in test_tui_pty.py.
      - name: Run Python and PTY tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run compatibility lab orchestration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/lab/tests -v

      - name: Run Go TUI tests
        run: |
          go test ./...
          go vet ./...

      - name: Check executable scripts
        run: |
          python -m py_compile system/system-helper
          python -m py_compile tests/fixtures/tui_backend.py
          python -m py_compile tests/lab/paddock-lab
          python -m py_compile release/validate-application-release.py
          bash -n system/check-ports system/php-fpm-launcher system/wait-for-socket
          bash -n packaging/arch/build-local.sh packaging/arch/paddock.install
          bash -n release/build-source.sh
          bash -n release/sign-application-release.sh
          bash -n tests/acceptance/run.sh
          bash -n tests/package/clean-install.sh
          bash -n scripts/plugin-dev-install.sh scripts/install.sh scripts/uninstall.sh
          bash -n release/php/build.sh

  arch-package:
    name: Arch package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      # Only what `actions/checkout` needs. The package's own dependencies come
      # from the PKGBUILD below, once there is a checkout to read it from.
      - name: Install checkout dependencies
        run: pacman -Syu --needed --noconfirm git

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Read from the PKGBUILD rather than repeated here. makepkg resolves
      # runtime dependencies before building, so a package this job does not
      # install fails the build rather than the runtime — and a second copy of
      # the list silently drifts from the first. Switching the web server from
      # caddy to nginx broke this job for exactly that reason.
      - name: Install package dependencies
        shell: bash
        run: |
          depends=()
          makedepends=()
          . packaging/arch/PKGBUILD
          pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}"

      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser --user builder -- ./packaging/arch/build-local.sh

      # Keep old local packages and the optional debug package out of the CI
      # artifact. The next job must install exactly what this build produced.
      - name: Stage the main package
        shell: bash
        run: |
          mkdir -p ci-package
          package_path=$(find packaging/arch -maxdepth 1 -type f \
            -name 'paddock-*-x86_64.pkg.tar.zst' ! -name '*-debug-*' \
            -print -quit)
          test -n "$package_path"
          cp -- "$package_path" ci-package/

      - name: Upload unsigned package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paddock-arch-x86_64
          path: ci-package/paddock-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  clean-package-install:
    name: Clean Arch package install
    needs: arch-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:base
    steps:
      - name: Install checkout dependency
        run: pacman -Syu --needed --noconfirm git

      - name: Check out acceptance script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paddock-arch-x86_64
          path: ci-package

      - name: Install and verify package in a fresh Arch container
        shell: bash
        run: ./tests/package/clean-install.sh ci-package/paddock-*.pkg.tar.zst
