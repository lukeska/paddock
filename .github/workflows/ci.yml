name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python and TUI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The only Python runtime dependency, for reading paddock.yml. Packaged
      # as python-yaml, which the Arch job installs with the other depends.
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      # Discovery includes the real PTY acceptance suite in test_tui_pty.py.
      - name: Run Python and PTY tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run Go TUI tests
        run: |
          go test ./...
          go vet ./...

      - name: Check executable scripts
        run: |
          python -m py_compile system/system-helper
          python -m py_compile tests/fixtures/tui_backend.py
          bash -n system/check-ports system/php-fpm-launcher system/wait-for-socket
          bash -n packaging/arch/build-local.sh packaging/arch/paddock.install
          bash -n tests/acceptance/run.sh
          bash -n scripts/plugin-dev-install.sh scripts/install.sh scripts/uninstall.sh
          bash -n release/php/build.sh

  arch-package:
    name: Arch package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Install package dependencies
        run: >-
          pacman -Syu --needed --noconfirm
          git go python python-yaml python-gobject gtk4 libadwaita caddy dnsmasq
          mkcert nss p11-kit networkmanager polkit podman

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser --user builder -- ./packaging/arch/build-local.sh

      - name: Upload unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paddock-arch-x86_64
          path: packaging/arch/paddock-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
