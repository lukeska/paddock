[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paddock"
version = "0.1.0"
description = "Local Laravel development environment for Omarchy"
requires-python = ">=3.13"
license = "MIT"

[project.scripts]
paddock = "paddock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
